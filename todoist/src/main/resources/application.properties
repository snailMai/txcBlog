server.address=127.0.0.1
server.port=8091
server.tomcat.threads.max=8
server.tomcat.threads.min-spare=1
server.tomcat.max-connections=32
server.error.include-message=never
server.error.include-stacktrace=never
spring.main.banner-mode=off
logging.level.root=ERROR
# 固定两份 Markdown 为唯一任务源；不再连接桌面或会话。
# properties 读取编码不保证 UTF-8，路径中的非 ASCII 字符一律用 Unicode 转义。
todoist.task-file=/Users/macminimai/Library/CloudStorage/\u575a\u679c\u4e91-15507814601@163.com/snailmaiNotes/journal/aiTodoist.md
todoist.archive-file=/Users/macminimai/Library/CloudStorage/\u575a\u679c\u4e91-15507814601@163.com/snailmaiNotes/journal/history/aiTodoistArchive.md
# 留空使用运行用户 Library/Application Support/personweb/todoist-state；仅存私有回执与恢复记录。
todoist.state-dir=
# 显式启用后，启动及每分钟检查并补建历史缺失周期；生产启用前核对补建范围。
todoist.recurring.enabled=false
